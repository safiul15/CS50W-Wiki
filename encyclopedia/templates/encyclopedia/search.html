{% extends "encyclopedia/layout.html" %}{% block title %}Search Results · Wiki{% endblock %}{% block body %}
<header class="page-heading"><p class="eyebrow">SEARCH</p><h1>Search Results</h1><p class="subtitle">Results for <strong>{{ query }}</strong></p></header>
<div class="entry-list">{% for entry in results %}<a class="entry-card" href="{% url 'entry' entry %}"><span>{{ entry }}</span><span class="arrow">→</span></a>{% empty %}<p class="empty-state">No matching entries found. Try another search.</p>{% endfor %}</div>{% endblock %}
